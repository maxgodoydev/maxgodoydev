name: Atualizar GitHub Insights

on:
  schedule:
    - cron: "0 */12 * * *"     # a cada 12 horas
  workflow_dispatch:            # botão "Run workflow" na aba Actions

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-latest
    env:
      URL: "https://github-profiles-insights.vercel.app/api/insight?username=maxgodoydev&theme=github_light&graph=true&languages=true&streak=true&stats=true&header=true&summary=true&profile=true"
    steps:
      - uses: actions/checkout@v4

      - name: Baixar o card
        run: |
          mkdir -p assets
          if curl -fsSL --retry 3 --retry-delay 10 --max-time 60 -o /tmp/novo.svg "$URL" \
             && head -c 400 /tmp/novo.svg | grep -q "<svg" \
             && grep -q "Most Used Languages" /tmp/novo.svg \
             && [ "$(wc -c < /tmp/novo.svg)" -gt 15000 ]; then
            mv /tmp/novo.svg assets/github-insights.svg
            echo "Card atualizado."
          else
            echo "::warning::O serviço não respondeu um SVG válido. Mantendo a versão anterior."
          fi

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-insights.svg
          git diff --cached --quiet || (git commit -m "chore: atualiza card do GitHub Insights" && git push)
