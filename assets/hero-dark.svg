<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="450" viewBox="0 0 1600 450" role="img" aria-labelledby="t d">
<title id="t">Max Godoy — Dados, Analytics e Business Intelligence</title>
<desc id="d">Banner com o nome Max Godoy, a área de atuação em Dados, Analytics e Business Intelligence e uma ilustração animada de um pipeline de dados e de um dashboard de BI.</desc>
<style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.sA{opacity:1;animation:fadeA 14s ease-in-out infinite}
.sB{opacity:0;animation:fadeB 14s ease-in-out infinite}
@keyframes fadeA{0%{opacity:0}5%{opacity:1}44%{opacity:1}50%{opacity:0}100%{opacity:0}}
@keyframes fadeB{0%{opacity:0}50%{opacity:0}56%{opacity:1}94%{opacity:1}100%{opacity:0}}
.gear{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flow{stroke-dasharray:6 7;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-26}}
.pk{opacity:0;animation:pk 1.9s ease-in-out infinite}
@keyframes pk{0%{transform:translateX(0);opacity:0}20%{opacity:1}80%{opacity:1}100%{transform:translateX(53px);opacity:0}}
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 14s ease-in-out infinite}
@keyframes grow{0%,50%{transform:scaleY(.12)}60%{transform:scaleY(1)}94%{transform:scaleY(1)}100%{transform:scaleY(.12)}}
.ln{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 14s ease-in-out infinite}
@keyframes draw{0%,52%{stroke-dashoffset:1}66%{stroke-dashoffset:0}94%{stroke-dashoffset:0}100%{stroke-dashoffset:1}}
.float{animation:bob 7s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.blink{animation:blink 3.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F1C30"/><stop offset="1" stop-color="#18304F"/></linearGradient>
<radialGradient id="glow1" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#2F5F94" stop-opacity=".55"/><stop offset="1" stop-color="#2F5F94" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="0.05" cy="1" r="0.5"><stop offset="0" stop-color="#2F5F94" stop-opacity=".35"/><stop offset="1" stop-color="#2F5F94" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#4A7099"/></pattern>
<clipPath id="frame"><rect width="1600" height="450" rx="28"/></clipPath>
</defs>

<g clip-path="url(#frame)">
<rect width="1600" height="450" fill="url(#bg)"/>
<rect width="1600" height="450" fill="url(#glow1)"/>
<rect width="1600" height="450" fill="url(#glow2)"/>
<rect width="1600" height="450" fill="url(#dots)" opacity=".55"/>

<!-- elementos decorativos que aparecem e somem no fundo -->
<g fill="none" stroke="#B5D6F6" stroke-width="1.6" opacity=".7">
<g class="float"><circle cx="800" cy="62" r="6" class="blink"/><path d="M806 62 H840 V90" opacity=".6"/></g>
<g class="float" style="animation-delay:-3s"><circle cx="838" cy="410" r="5" class="blink" style="animation-delay:-1.2s"/><path d="M832 410 H790 V384" opacity=".6"/></g>
<g class="float" style="animation-delay:-5s"><rect x="1556" y="330" width="14" height="14" rx="3" class="blink" style="animation-delay:-2s"/></g>
<g class="float" style="animation-delay:-1.5s"><rect x="852" y="236" width="12" height="12" rx="3" class="blink" style="animation-delay:-.6s"/></g>
</g>

<!-- ============ texto fixo (esquerda) ============ -->
<text x="64" y="66" font-size="15" font-weight="700" letter-spacing="4.5" fill="#8FA9C6">PORTFÓLIO PROFISSIONAL</text>
<text x="62" y="152" font-size="84" font-weight="800" fill="#EAF3FD" letter-spacing="-1">Max <tspan fill="#8DC0F0">Godoy</tspan></text>
<text x="64" y="204" font-size="26" font-weight="800" fill="#EAF3FD" letter-spacing=".4">DADOS, ANALYTICS &amp; BUSINESS INTELLIGENCE</text>
<text x="64" y="238" font-size="19" fill="#8FA9C6" letter-spacing=".5">Excel · SQL · Power BI · Python</text>
<text x="64" y="288" font-size="20" fill="#B6CBE2">Estudante de DSM (FATEC) em transição de carreira para Dados,</text>
<text x="64" y="316" font-size="20" fill="#B6CBE2">Analytics &amp; Business Intelligence.</text>

<text x="64" y="364" font-size="13.5" font-weight="800" letter-spacing="3.5" fill="#8FA9C6">EM BUSCA DE ESTÁGIO</text>
